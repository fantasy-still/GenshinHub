[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshinhub"
version = "0.1.2"
description = "只读原神剧情知识库与 DeepSeek 原生 API 桌面客户端"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "markdown-it-py>=3,<5", "keyring>=25,<26", "pywebview>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.48"]

[project.scripts]
genshinhub = "twwiki.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["twwiki*"]
